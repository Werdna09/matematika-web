{% load static %}

<!DOCTYPE html>
<html lang="cs">



<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}
        Matematika
        {% endblock %}
    </title>

    <link rel="stylesheet" href="{% static 'css/style.css' %}">

    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['\\(', '\\)']],
                displayMath: [['\\[', '\\]']]
            }
        };
    </script>

    <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js">
    </script>
</head>

<body>

    <header class="site-header">

        <div class="container header-content">

            <a href="{% url 'core:home' %}" class="site-title">
                Matematika
            </a>


            <div class="header-actions">

                <form action="{% url 'materials:search' %}" method="get" class="search-form">

                    <input type="search" name="q" value="{{ request.GET.q|default:'' }}" placeholder="Hledat materiál…"
                        aria-label="Hledat materiál">

                    <button type="submit">
                        Hledat
                    </button>

                </form>


                <nav>

                    <a href="{% url 'core:home' %}">
                        Materiály
                    </a>

                </nav>

            </div>

        </div>

    </header>


    <main class="container">

        {% block content %}
        {% endblock %}

    </main>


    <footer class="site-footer">

        <div class="container">
            Matematika
        </div>

    </footer>

</body>

</html>
