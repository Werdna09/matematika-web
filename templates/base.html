{% load static %}

<!DOCTYPE html>
<html lang="cs">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Mathera{% endblock %}</title>
    <meta name="description" content="Mathera — přehledné materiály a podklady pro středoškolskou matematiku.">

    <link rel="stylesheet" href="{% static 'css/style.css' %}">

    <link rel="icon" type="image/x-icon" href="{% static 'favicon/favicon.ico' %}">
    <link rel="icon" type="image/png" sizes="32x32" href="{% static 'favicon/favicon-32x32.png' %}">
    <link rel="icon" type="image/png" sizes="16x16" href="{% static 'favicon/favicon-16x16.png' %}">
    <link rel="apple-touch-icon" href="{% static 'favicon/apple-touch-icon.png' %}">

    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['\\(', '\\)']],
                displayMath: [['\\[', '\\]']]
            }
        };
    </script>

    <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>

<body>

    <header class="site-header">
        <div class="container header-content">

            <a href="{% url 'core:home' %}" class="site-title" aria-label="Mathera — domů">
                <span class="site-mark" aria-hidden="true">∑</span>
                <span>Mathera</span>
            </a>

            <div class="header-actions">

                <nav class="main-nav" aria-label="Hlavní navigace">
                    <a href="{% url 'core:home' %}">Domů</a>
                    <a href="{% url 'core:home' %}#rocniky">Materiály</a>
                    <a href="{% url 'core:home' %}#o-projektu">O projektu</a>
                </nav>

                <form action="{% url 'materials:search' %}" method="get" class="search-form">
                    <input type="search" name="q" value="{{ request.GET.q|default:'' }}" placeholder="Hledat…"
                        aria-label="Hledat materiál">
                    <button type="submit">Hledat</button>
                </form>

            </div>
        </div>
    </header>

    <main class="container site-main">
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
        <div class="container footer-content">
            <div>
                <strong>Mathera</strong>
                <span>Matematika přehledně a bez zbytečností.</span>
            </div>

            <span class="footer-note">Středoškolská matematika</span>
        </div>
    </footer>

</body>

</html>
