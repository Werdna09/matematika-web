<h1 id="kvadratická-rovnice">Kvadratická rovnice</h1>
<p>Kvadratickou rovnicí nazýváme rovnici ve tvaru</p>
<p><span class="math display">\[ax^2 + bx + c = 0,\]</span></p>
<p>kde <span class="math inline">\(a \neq 0\)</span>.</p>
<h2 id="diskriminant">Diskriminant</h2>
<p>Diskriminant vypočítáme podle vztahu</p>
<p><span class="math display">\[D = b^2 - 4ac.\]</span></p>
<p>Je-li <span class="math inline">\(D &gt; 0\)</span>, má rovnice dva
různé reálné kořeny.</p>
